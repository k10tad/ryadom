<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171723">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Рядом</title>
  <link rel="icon" href="assets/icons/icon.jpg">
  <link rel="apple-touch-icon" href="assets/icons/icon.jpg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style-v050.css?v=0.9.0">
</head>
<body>
  <main class="app" id="app" data-room="living">
    <div class="room-background" aria-hidden="true"></div>
    <div class="room-shade" aria-hidden="true"></div>

    <header class="topbar">
      <button class="brand" type="button" data-open="settings" aria-label="設定を開く">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span><strong>Рядом</strong><small>いつも、そばに</small></span>
      </button>
      <div class="clock" aria-label="現在日時">
        <strong id="clock-time">--:--</strong>
        <small id="clock-date">----</small>
      </div>
    </header>

    <section class="room-tabs" aria-label="部屋の切り替え">
      <button class="is-active" type="button" data-room-button="living">Living</button>
      <button type="button" data-room-button="bedroom">Bedroom</button>
    </section>

    <section class="home" id="home-view">
      <div class="character-area">
        <figure class="alek-portrait">
          <img id="alek-image" src="assets/alek/alek-home.jpg" alt="こちらを見つめるアレク">
          <div class="portrait-tools" aria-label="ホーム機能">
            <button type="button" data-open="rhythm">
              <span class="tool-mark rhythm-mark" aria-hidden="true"><i></i><i></i><i></i></span>
              <span><strong>Ритм</strong><small>周期と服薬予定</small></span>
            </button>
            <button type="button" data-open="say">
              <span class="tool-mark say-mark" aria-hidden="true">···</span>
              <span><strong>Скажи</strong><small>アレクに話す</small></span>
            </button>
          </div>
          <figcaption class="now-pill"><i></i><span>NOW</span><strong id="now-action">レイを待ってる</strong></figcaption>
        </figure>

        <article class="speech-flow" aria-live="polite">
          <div class="speech-label"><span>ALEK</span><button id="voice-button" type="button">VOICE</button></div>
          <p id="alek-line">おかえり、レイ。今日はどんな一日だった？</p>
          <button class="next-line" id="next-line" type="button" aria-label="次の音声付きの言葉">もう一度、話す</button>
        </article>
      </div>

      <section class="quick-actions" aria-label="よく使う操作">
        <button type="button" data-open="medicine"><b>＋</b><span>薬を記録<small>服用した日時</small></span></button>
        <button type="button" data-open="condition"><b>≈</b><span>体調を伝える<small>今の症状や気分</small></span></button>
      </section>

      <button class="beside-button" id="beside-button" type="button">
        <span class="bud" aria-hidden="true"></span>
        <span><strong>そばにいて</strong><small>静かな寄り添いモード</small></span>
      </button>
    </section>

    <nav class="vine-nav" aria-label="Рядом navigation">
      <span class="vine" aria-hidden="true"></span>
      <button class="is-active" type="button" data-nav="home" aria-label="ホーム">
        <b aria-hidden="true">⌂</b><span>Рядом<small>ホーム</small></span>
      </button>
      <button type="button" data-nav="condition" data-open="condition" aria-label="体調を記録">
        <b aria-hidden="true">≈</b><span>Приём<small>体調</small></span>
      </button>
      <button type="button" data-nav="medicine" data-open="medicine" aria-label="服薬を記録">
        <b aria-hidden="true">＋</b><span>Лекарства<small>服薬</small></span>
      </button>
    </nav>

    <dialog class="sheet" id="sheet">
      <div class="sheet-grip" aria-hidden="true"></div>
      <header class="sheet-header">
        <div><small id="sheet-kicker"></small><h2 id="sheet-title"></h2></div>
        <button type="button" id="close-sheet" aria-label="閉じる">×</button>
      </header>
      <div id="sheet-content"></div>
    </dialog>

    <dialog class="onboarding" id="onboarding" aria-labelledby="onboarding-title">
      <div class="onboarding-mark" aria-hidden="true"><i></i><i></i><i></i></div>
      <small>ПЕРВАЯ НАСТРОЙКА</small>
      <h2 id="onboarding-title">最初に、君のことを教えて</h2>
      <p>名前と地域、それから今使っている薬と持病を分けて覚える。服用した記録や症状とは混ぜないから安心して。</p>
      <form class="form-grid" id="onboarding-form" data-form="onboarding">
        <label>名前<input name="name" autocomplete="name" required placeholder="レイ"></label>
        <label>地域<input name="region" autocomplete="address-level1" required placeholder="大阪府"></label>
        <label>現在使っている薬<textarea name="medications" required placeholder="ロメリジン、レイボー&#10;なければ「なし」と入力してね"></textarea></label>
        <label>診断されている持病<textarea name="conditions" required placeholder="心房細動、片頭痛&#10;なければ「なし」と入力してね"></textarea></label>
        <p class="medical-note">薬名や疾患名を内部辞書と照合してプロフィールに保存します。特定できない名前は推測せず、未確認のまま保持します。</p>
        <button class="primary" type="submit">登録して始める</button>
      </form>
    </dialog>

    <section class="quiet-mode" id="quiet-mode" aria-hidden="true">
      <div class="quiet-copy"><small>РЯДОМ</small><p id="quiet-line">何もしなくていいよ。ここにいるから。</p></div>
      <button type="button" id="leave-quiet">戻る</button>
    </section>
  </main>
  <script type="module" src="js/app.js?v=0.9.3"></script>
</body>
</html>
